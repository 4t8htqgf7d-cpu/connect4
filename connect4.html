<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect 4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Unify Partners palette ─────────────────────────────────
       #c28f6c  warm bronze  (primary brand accent)
       #9e6a53  deep brown   (secondary brand accent)
       Board:   walnut wood tones to carry the earth palette
    ────────────────────────────────────────────────────────── */

    body {
      background: #13100d;
      background-image: radial-gradient(ellipse at 50% 0%,
        rgba(194,143,108,0.10) 0%, transparent 65%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e8d8c8;
    }

    /* ── Title ──────────────────────────────────────────────── */
    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: 8px;
      color: #c28f6c;
      text-shadow: 0 0 28px rgba(194,143,108,0.4);
      margin-bottom: 22px;
      text-transform: uppercase;
    }

    /* ── Score card ─────────────────────────────────────────── */
    #score {
      display: flex;
      gap: 0;
      margin-bottom: 18px;
      background: rgba(194,143,108,0.06);
      border: 1px solid rgba(194,143,108,0.18);
      border-radius: 14px;
      overflow: hidden;
    }

    .score-box {
      text-align: center;
      padding: 10px 30px;
    }

    .score-box + .score-box {
      border-left: 1px solid rgba(194,143,108,0.15);
    }

    .score-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: rgba(194,143,108,0.6);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 2px;
    }

    .score-val           { font-size: 1.8rem; font-weight: 700; line-height: 1; }
    .score-val.red       { color: #ef5350; }
    .score-val.yellow    { color: #fdd835; }
    .score-val.draws     { color: #c28f6c; }

    /* ── Status pill ───────────────────────────────────────── */
    #status-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      background: rgba(194,143,108,0.06);
      border: 1px solid rgba(194,143,108,0.18);
      border-radius: 100px;
      padding: 7px 20px;
      min-width: 180px;
      justify-content: center;
    }

    #status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.25s, box-shadow 0.25s;
    }

    #status {
      font-size: 0.9rem;
      font-weight: 600;
      transition: color 0.25s;
      letter-spacing: 0.3px;
      color: #c28f6c;
    }

    /* ── Board — walnut wood ────────────────────────────────── */
    #board-wrapper {
      background: linear-gradient(170deg, #6b3d20 0%, #5a3018 55%, #4a2512 100%);
      border-radius: 18px;
      padding: 14px;
      box-shadow:
        0 24px 64px rgba(0,0,0,0.75),
        0 1px 0 rgba(255,255,255,0.07) inset,
        0 -3px 0 rgba(0,0,0,0.4) inset;
      position: relative;
    }

    /* Subtle wood-grain highlight line at top */
    #board-wrapper::before {
      content: '';
      position: absolute;
      top: 0; left: 12%; right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
      border-radius: 50%;
    }

    /* ── Column drop indicators ────────────────────────────── */
    #column-arrows {
      display: grid;
      grid-template-columns: repeat(7, 70px);
      gap: 8px;
      margin-bottom: 8px;
    }

    .arrow-btn {
      height: 30px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: color 0.15s, transform 0.12s;
      border-radius: 6px;
      color: rgba(194,143,108,0.25);
    }

    .arrow-btn.red-turn    { color: rgba(239,83,80,0.3); }
    .arrow-btn.yellow-turn { color: rgba(253,216,53,0.3); }
    .arrow-btn.red-turn:hover    { color: #ef5350; transform: translateY(-2px) scale(1.15); }
    .arrow-btn.yellow-turn:hover { color: #fdd835; transform: translateY(-2px) scale(1.15); }

    /* ── Board grid ────────────────────────────────────────── */
    #board {
      display: grid;
      grid-template-columns: repeat(7, 70px);
      grid-template-rows: repeat(6, 70px);
      gap: 8px;
    }

    /* Empty cell — deep hole through the wood */
    .cell {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #0e0805;
      box-shadow:
        inset 0 7px 20px rgba(0,0,0,0.9),
        inset 0 2px 5px rgba(0,0,0,0.6),
        inset 0 -1px 2px rgba(255,255,255,0.03);
      position: relative;
      cursor: pointer;
    }

    /* Hole rim — warm wood edge highlight */
    .cell::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: transparent;
      box-shadow: 0 0 0 2px rgba(100,55,20,0.5);
      pointer-events: none;
    }

    /* Red piece — 3D disc */
    .cell.red {
      background:
        radial-gradient(circle at 33% 26%, rgba(255,255,255,0.55) 0%, transparent 26%),
        radial-gradient(circle at 42% 40%, #ff6b6b 0%, #e53935 48%, #b71c1c 100%);
      box-shadow:
        inset 0 -5px 10px rgba(0,0,0,0.35),
        inset 0 3px 5px rgba(255,255,255,0.12),
        0 4px 16px rgba(183,28,28,0.5),
        0 0 0 2px rgba(0,0,0,0.2);
      cursor: default;
    }

    /* Yellow piece — 3D disc */
    .cell.yellow {
      background:
        radial-gradient(circle at 33% 26%, rgba(255,255,255,0.65) 0%, transparent 26%),
        radial-gradient(circle at 42% 40%, #ffe066 0%, #fdd835 45%, #e65100 100%);
      box-shadow:
        inset 0 -5px 10px rgba(0,0,0,0.3),
        inset 0 3px 5px rgba(255,255,255,0.18),
        0 4px 16px rgba(230,81,0,0.45),
        0 0 0 2px rgba(0,0,0,0.18);
      cursor: default;
    }

    .cell.red::before, .cell.yellow::before { display: none; }

    /* Ghost hover preview */
    .cell.ghost-red {
      background:
        radial-gradient(circle at 33% 26%, rgba(255,255,255,0.35) 0%, transparent 26%),
        radial-gradient(circle at 42% 40%, rgba(255,107,107,0.45) 0%, rgba(229,57,53,0.3) 100%);
      box-shadow: inset 0 7px 20px rgba(0,0,0,0.85);
    }

    .cell.ghost-yellow {
      background:
        radial-gradient(circle at 33% 26%, rgba(255,255,255,0.45) 0%, transparent 26%),
        radial-gradient(circle at 42% 40%, rgba(255,224,102,0.45) 0%, rgba(253,216,53,0.3) 100%);
      box-shadow: inset 0 7px 20px rgba(0,0,0,0.85);
    }

    /* Win flash */
    .cell.win-flash { animation: win-pulse 0.5s ease-in-out infinite alternate; }

    @keyframes win-pulse {
      from { transform: scale(1);    filter: brightness(1); }
      to   { transform: scale(1.09); filter: brightness(1.55) drop-shadow(0 0 10px rgba(194,143,108,0.8)); }
    }

    /* ── Buttons ─────────────────────────────────────────────── */
    #controls {
      display: flex;
      gap: 10px;
      margin-top: 22px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button.action-btn {
      padding: 10px 26px;
      border: none;
      border-radius: 100px;
      font-size: 0.88rem;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.4px;
      transition: transform 0.1s, filter 0.1s, box-shadow 0.1s;
    }

    button.action-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    button.action-btn:active { transform: translateY(0); filter: brightness(0.92); }

    /* Bronze primary, deep brown secondary */
    #restart-btn { background: #c28f6c; color: #1a0e06; }
    #mode-btn    { background: #9e6a53; color: #f5e8dc; }

    /* ── Difficulty ──────────────────────────────────────────── */
    #difficulty {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      align-items: center;
    }

    #difficulty span {
      font-size: 0.72rem;
      font-weight: 700;
      color: rgba(194,143,108,0.45);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-right: 4px;
    }

    .diff-btn {
      padding: 5px 14px;
      border: 1.5px solid rgba(194,143,108,0.18);
      border-radius: 100px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      background: rgba(194,143,108,0.06);
      color: rgba(194,143,108,0.4);
      transition: all 0.15s;
      letter-spacing: 0.3px;
    }

    .diff-btn:hover { color: #c28f6c; border-color: rgba(194,143,108,0.4); }

    .diff-btn.active-easy   { background: #2e7d32; color: #d4edda; border-color: #4caf50; }
    .diff-btn.active-medium { background: #bf6000; color: #ffeacc; border-color: #e65100; }
    .diff-btn.active-hard   { background: #b71c1c; color: #fde0dc; border-color: #ef5350; }

    /* ── Fireworks ───────────────────────────────────────────── */
    #fireworks {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

<canvas id="fireworks"></canvas>

<h1>Connect 4</h1>

<div id="score">
  <div class="score-box">
    <div class="score-label" id="p1-label">Player 1</div>
    <div class="score-val red" id="score-red">0</div>
  </div>
  <div class="score-box">
    <div class="score-label">Draws</div>
    <div class="score-val draws" id="score-draw">0</div>
  </div>
  <div class="score-box">
    <div class="score-label" id="p2-label">Player 2</div>
    <div class="score-val yellow" id="score-yellow">0</div>
  </div>
</div>

<div id="status-wrap">
  <div id="status-dot"></div>
  <div id="status">Red's turn</div>
</div>

<div id="board-wrapper">
  <div id="column-arrows"></div>
  <div id="board"></div>
</div>

<div id="controls">
  <button class="action-btn" id="restart-btn">New Game</button>
  <button class="action-btn" id="mode-btn">vs CPU</button>
</div>

<div id="difficulty">
  <span>Difficulty:</span>
  <button class="diff-btn active-easy" data-depth="0" id="diff-easy">Easy</button>
  <button class="diff-btn"             data-depth="3" id="diff-medium">Medium</button>
  <button class="diff-btn"             data-depth="6" id="diff-hard">Hard</button>
</div>

<script>
  const ROWS = 6, COLS = 7;
  let board, currentPlayer, gameOver, scores, vsAI, aiThinking, aiDepth, hoverCol;

  scores   = { red: 0, yellow: 0, draw: 0 };
  vsAI     = false;
  aiDepth  = 0;
  hoverCol = null;

  // ── Difficulty buttons ─────────────────────────────────────────
  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.diff-btn').forEach(b => b.className = 'diff-btn');
      const depth = parseInt(btn.dataset.depth);
      aiDepth = depth;
      if (depth === 0)      btn.classList.add('active-easy');
      else if (depth === 3) btn.classList.add('active-medium');
      else                  btn.classList.add('active-hard');
    });
  });

  function init() {
    board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    currentPlayer = 'red';
    gameOver   = false;
    aiThinking = false;
    hoverCol   = null;
    renderBoard();
    setStatus("Red's turn", 'red');
  }

  function playerName(p) {
    if (p === 'red') return 'Red';
    return vsAI ? 'CPU' : 'Yellow';
  }

  // ── Rendering ──────────────────────────────────────────────────
  function renderBoard() {
    const arrowsEl = document.getElementById('column-arrows');
    const boardEl  = document.getElementById('board');
    arrowsEl.innerHTML = '';
    boardEl.innerHTML  = '';

    for (let c = 0; c < COLS; c++) {
      const btn = document.createElement('button');
      btn.className = `arrow-btn ${currentPlayer}-turn`;
      btn.textContent = '▼';
      btn.dataset.col = c;
      btn.addEventListener('click', () => handleClick(c));
      btn.addEventListener('mouseenter', () => { hoverCol = c; updateGhosts(); });
      btn.addEventListener('mouseleave', () => { hoverCol = null; updateGhosts(); });
      arrowsEl.appendChild(btn);
    }

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('div');
        cell.id = `cell-${r}-${c}`;
        cell.addEventListener('mouseenter', () => { hoverCol = c; updateGhosts(); });
        cell.addEventListener('mouseleave', () => { hoverCol = null; updateGhosts(); });
        cell.addEventListener('click', () => handleClick(c));
        boardEl.appendChild(cell);
        updateCell(r, c);
      }
    }
  }

  function cellClass(r, c) {
    const val = board[r][c];
    if (val === 'red')    return 'cell red';
    if (val === 'yellow') return 'cell yellow';
    if (!gameOver && hoverCol === c && getOpenRow(c) === r)
      return currentPlayer === 'red' ? 'cell ghost-red' : 'cell ghost-yellow';
    return 'cell';
  }

  function updateCell(r, c) {
    const cell = document.getElementById(`cell-${r}-${c}`);
    if (cell) cell.className = cellClass(r, c);
  }

  function updateGhosts() {
    for (let c = 0; c < COLS; c++)
      for (let rr = 0; rr < ROWS; rr++)
        if (!board[rr][c]) updateCell(rr, c);
  }

  function setStatus(msg, color) {
    document.getElementById('status').textContent = msg;
    const dot = document.getElementById('status-dot');
    const statusEl = document.getElementById('status');
    if (color === 'red') {
      statusEl.style.color = '#ef5350';
      dot.style.background = '#ef5350';
      dot.style.boxShadow  = '0 0 6px #ef5350';
    } else if (color === 'yellow') {
      statusEl.style.color = '#fdd835';
      dot.style.background = '#fdd835';
      dot.style.boxShadow  = '0 0 6px #fdd835';
    } else {
      statusEl.style.color = '#c28f6c';
      dot.style.background = '#c28f6c';
      dot.style.boxShadow  = '0 0 6px rgba(194,143,108,0.6)';
    }
  }

  // ── Game logic ─────────────────────────────────────────────────
  function handleClick(col) {
    if (gameOver || aiThinking) return;
    if (vsAI && currentPlayer === 'yellow') return;
    dropPiece(col);
  }

  function dropPiece(col) {
    const row = getOpenRow(col);
    if (row === -1) return;

    board[row][col] = currentPlayer;
    updateCell(row, col);

    const wins = checkWin(row, col, currentPlayer);
    if (wins) {
      flashCells(wins);
      scores[currentPlayer]++;
      updateScoreDisplay();
      setStatus(`${playerName(currentPlayer)} wins!`, currentPlayer);
      gameOver = true;
      launchFireworks(currentPlayer);
      return;
    }

    if (isDraw()) {
      scores.draw++;
      updateScoreDisplay();
      setStatus("It's a draw!", '');
      gameOver = true;
      return;
    }

    currentPlayer = currentPlayer === 'red' ? 'yellow' : 'red';
    updateArrows();

    if (vsAI && currentPlayer === 'yellow') {
      setStatus('CPU is thinking…', 'yellow');
      aiThinking = true;
      setTimeout(() => { aiMove(); aiThinking = false; }, 300);
    } else {
      setStatus(`${playerName(currentPlayer)}'s turn`, currentPlayer);
    }
  }

  function getOpenRow(col) {
    for (let r = ROWS - 1; r >= 0; r--) if (!board[r][col]) return r;
    return -1;
  }

  function isDraw() { return board[0].every(c => c !== null); }

  function checkWin(row, col, player) {
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (const [dr, dc] of dirs) {
      const cells = [[row, col]];
      for (const sign of [1, -1]) {
        let r = row + dr*sign, c = col + dc*sign;
        while (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === player) {
          cells.push([r, c]); r += dr*sign; c += dc*sign;
        }
      }
      if (cells.length >= 4) return cells;
    }
    return null;
  }

  function flashCells(cells) {
    for (const [r, c] of cells)
      document.getElementById(`cell-${r}-${c}`).classList.add('win-flash');
  }

  function updateArrows() {
    document.querySelectorAll('.arrow-btn').forEach(btn => {
      btn.className = `arrow-btn ${currentPlayer}-turn`;
    });
  }

  function updateScoreDisplay() {
    document.getElementById('score-red').textContent    = scores.red;
    document.getElementById('score-yellow').textContent = scores.yellow;
    document.getElementById('score-draw').textContent   = scores.draw;
  }

  // ── AI ─────────────────────────────────────────────────────────
  function aiMove() {
    let col;
    if (aiDepth === 0) {
      const valid = [];
      for (let c = 0; c < COLS; c++) if (getOpenRow(c) !== -1) valid.push(c);
      col = valid[Math.floor(Math.random() * valid.length)];
    } else {
      col = bestMove(aiDepth);
    }
    dropPiece(col);
  }

  function bestMove(depth) {
    let best = -Infinity, bestCol = 3;
    for (let c = 0; c < COLS; c++) {
      if (getOpenRow(c) === -1) continue;
      const r = getOpenRow(c);
      board[r][c] = 'yellow';
      const score = minimax(board, depth, -Infinity, Infinity, false);
      board[r][c] = null;
      if (score > best) { best = score; bestCol = c; }
    }
    return bestCol;
  }

  function minimax(b, depth, alpha, beta, maximizing) {
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        if (!b[r][c]) continue;
        if (checkWinBoard(b, r, c, b[r][c]))
          return b[r][c] === 'yellow' ? 1000 + depth : -(1000 + depth);
      }
    if (depth === 0 || b[0].every(c => c !== null)) return scoreBoard(b);

    if (maximizing) {
      let val = -Infinity;
      for (let c = 0; c < COLS; c++) {
        const r = getOpenRowB(b, c); if (r === -1) continue;
        b[r][c] = 'yellow';
        val = Math.max(val, minimax(b, depth-1, alpha, beta, false));
        b[r][c] = null; alpha = Math.max(alpha, val);
        if (alpha >= beta) break;
      }
      return val;
    } else {
      let val = Infinity;
      for (let c = 0; c < COLS; c++) {
        const r = getOpenRowB(b, c); if (r === -1) continue;
        b[r][c] = 'red';
        val = Math.min(val, minimax(b, depth-1, alpha, beta, true));
        b[r][c] = null; beta = Math.min(beta, val);
        if (alpha >= beta) break;
      }
      return val;
    }
  }

  function getOpenRowB(b, col) {
    for (let r = ROWS-1; r >= 0; r--) if (!b[r][col]) return r;
    return -1;
  }

  function checkWinBoard(b, row, col, player) {
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (const [dr, dc] of dirs) {
      let count = 1;
      for (const sign of [1,-1]) {
        let r = row+dr*sign, c = col+dc*sign;
        while (r>=0&&r<ROWS&&c>=0&&c<COLS&&b[r][c]===player) { count++; r+=dr*sign; c+=dc*sign; }
      }
      if (count >= 4) return true;
    }
    return false;
  }

  function scoreBoard(b) {
    let s = 0;
    for (let r = 0; r < ROWS; r++) {
      if (b[r][3] === 'yellow') s += 3; else if (b[r][3] === 'red') s -= 3;
    }
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        for (const [dr, dc] of dirs) {
          const w = [];
          for (let i = 0; i < 4; i++) {
            const nr = r+dr*i, nc = c+dc*i;
            if (nr<0||nr>=ROWS||nc<0||nc>=COLS) break;
            w.push(b[nr][nc]);
          }
          if (w.length === 4) s += scoreWindow(w);
        }
    return s;
  }

  function scoreWindow(w) {
    const y = w.filter(x=>x==='yellow').length;
    const r = w.filter(x=>x==='red').length;
    const e = w.filter(x=>!x).length;
    if (y===4) return 100; if (y===3&&e===1) return 5; if (y===2&&e===2) return 2;
    if (r===3&&e===1) return -4; if (r===4) return -100;
    return 0;
  }

  // ── Fireworks — bronze + winner colour ─────────────────────────
  const fwCanvas = document.getElementById('fireworks');
  const fwCtx    = fwCanvas.getContext('2d');
  let   fwFrame  = null, particles = [];

  function resizeFireworks() {
    fwCanvas.width  = window.innerWidth;
    fwCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeFireworks);
  resizeFireworks();

  function launchFireworks(winner) {
    if (fwFrame) cancelAnimationFrame(fwFrame);
    particles = [];

    // Mix winner colour with brand bronze for the fireworks palette
    const baseColors = winner === 'red'
      ? ['#ef5350','#ff8a80','#ff1744','#c28f6c','#e8a87c','#fff']
      : ['#fdd835','#fff176','#ffea00','#c28f6c','#e8a87c','#fff'];

    for (let b = 0; b < 7; b++) setTimeout(() => burst(baseColors), b * 310);

    const start = performance.now();
    function animate(now) {
      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
      particles = particles.filter(p => p.life > 0);
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.99; p.life -= 1.5;
        fwCtx.globalAlpha = Math.max(0, p.life / p.maxLife);
        fwCtx.fillStyle = p.color;
        fwCtx.beginPath();
        fwCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        fwCtx.fill();
      }
      fwCtx.globalAlpha = 1;
      if (now - start < 4200) fwFrame = requestAnimationFrame(animate);
      else fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
    }
    fwFrame = requestAnimationFrame(animate);
  }

  function burst(colors) {
    const x = fwCanvas.width  * (0.15 + Math.random() * 0.7);
    const y = fwCanvas.height * (0.08 + Math.random() * 0.5);
    const count = 90 + Math.floor(Math.random() * 50);
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const speed = 2 + Math.random() * 6;
      const life  = 55 + Math.random() * 45;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: 1.5 + Math.random() * 3,
        color: colors[Math.floor(Math.random() * colors.length)],
        life, maxLife: life
      });
    }
  }

  // ── Controls ───────────────────────────────────────────────────
  document.getElementById('restart-btn').addEventListener('click', () => {
    if (fwFrame) { cancelAnimationFrame(fwFrame); fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height); }
    init();
  });

  document.getElementById('mode-btn').addEventListener('click', () => {
    vsAI = !vsAI;
    document.getElementById('mode-btn').textContent  = vsAI ? 'vs Human' : 'vs CPU';
    document.getElementById('p2-label').textContent  = vsAI ? 'CPU' : 'Player 2';
    document.getElementById('difficulty').style.display = vsAI ? 'flex' : 'none';
    scores = { red: 0, yellow: 0, draw: 0 };
    updateScoreDisplay();
    init();
  });

  document.getElementById('difficulty').style.display = 'none';

  init();
</script>
</body>
</html>
